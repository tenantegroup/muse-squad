name: Tests

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Installer and payload tests
        run: bash scripts/test-install.sh
      - name: MCP bridge tests
        run: node scripts/test-mcp-bridge.js
      - name: Project memory tests
        run: node scripts/test-memory.js
